<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SARA STORE – Catálogo de preços | Sara Biguaçu</title>
  <meta name="description" content="Catálogo de preços da loja da Igreja Sara Nossa Terra Biguaçu: camisetas, livros, bíblias e mais. Vendas somente presenciais, no balcão da loja.">
  <meta name="theme-color" content="#6F5227">
  <meta name="color-scheme" content="only light">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="SARA STORE">
  <meta property="og:title" content="SARA STORE – Catálogo de preços | Sara Biguaçu">
  <meta property="og:description" content="Veja os preços da loja da Igreja Sara Nossa Terra Biguaçu. Vendas somente presenciais, no balcão.">
  <meta property="og:url" content="https://sarabiguacu.github.io/SaraStore/">
  <meta property="og:image" content="https://sarabiguacu.github.io/SaraStore/img/logo.png">
  <meta property="og:image:width" content="360">
  <meta property="og:image:height" content="360">
  <meta property="og:image:alt" content="Logo da Igreja Sara Nossa Terra Biguaçu: a chama">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="img/icone.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <!-- Antes do CSS e sem module/defer: aplica o tema escolhido antes de a página aparecer. -->
  <script src="js/tema.js?v=1"></script>
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="modulepreload" href="js/comum.js?v=2">
  <link rel="modulepreload" href="js/dialogo.js?v=1">
  <script type="module" src="js/app.js?v=4"></script>
  <noscript><style>.carregando, .busca, .tema { display: none; }</style></noscript>
</head>
<body>
  <header class="topo">
    <div class="conteudo">
      <span class="logo" aria-hidden="true"><img src="img/chama.png" alt="" width="26" height="48"><span>sara</span></span>
      <div>
        <h1 id="titulo" tabindex="-1">SARA STORE</h1>
        <p>Igreja Sara Nossa Terra Biguaçu • Catálogo de preços</p>
      </div>
      <button class="tema" type="button" data-alternar-tema aria-pressed="false" aria-label="Modo escuro" title="Modo escuro">
        <svg class="tema-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="tema-lua" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <p class="faixa">Vendas somente presenciais no balcão da loja<span id="faixa-pagamentos"></span></p>

  <main>
    <!-- Destaque da promoção: troque a imagem por uma com nome novo (ou apague este bloco) quando ela acabar. -->
    <div class="conteudo destaque">
      <img src="img/aviso-2.jpeg" alt="Camiseta #PRACIMA Conference 2026: 1 camiseta por R$ 60,00 ou 2 por R$ 100,00. Disponíveis nas cores azul e bege." width="1024" height="1536" fetchpriority="high">
    </div>
    <div class="busca conteudo" role="search">
      <label class="vh" for="busca">Buscar produto</label>
      <div class="campo">
        <input id="busca" type="search" placeholder="Buscar produto…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button id="limpar" class="limpar" type="button" aria-label="Limpar busca" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <p id="contagem" class="contagem conteudo" role="status" aria-live="polite"></p>

    <nav id="chips" class="chips" aria-label="Categorias" hidden></nav>

    <div class="conteudo"><div id="aviso" class="aviso" role="status" hidden></div></div>

    <div id="lista" class="lista conteudo" aria-busy="true">
      <div class="carregando">
        <p class="vh">Carregando o catálogo…</p>
        <div class="esqueleto" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <noscript>
        <p class="erro">Para ver o catálogo, ative o JavaScript do navegador. Os preços também podem ser consultados no balcão da loja.</p>
      </noscript>
    </div>
  </main>

  <section id="igreja" class="igreja" aria-labelledby="igreja-titulo" hidden>
    <div id="igreja-conteudo" class="conteudo"></div>
  </section>

  <footer class="rodape">
    <p><span id="atualizado"></span>Preços podem mudar; confirme no balcão.</p>
    <p>© <span id="ano">2026</span> SARA STORE — <span id="copyright">Todos os direitos reservados</span></p>
    <p>Igreja Sara Nossa Terra Biguaçu</p>
  </footer>

  <button id="voltar-topo" class="voltar-topo" type="button" aria-label="Voltar ao topo" hidden>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
  </button>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <dialog id="detalhe" class="detalhe" aria-labelledby="detalhe-nome">
    <button id="fechar" class="fechar" type="button" aria-label="Fechar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="detalhe-conteudo" class="detalhe-in"></div>
  </dialog>
</body>
</html>
